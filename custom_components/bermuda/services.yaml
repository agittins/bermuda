dump_devices:
  name: Dump devices
  fields:
    addresses:
      required: false
      example: "EE:E8:37:9F:6B:54 C7:B8:C6:B0:27:11 AA:AA:AA:AA:AA:AA"
      default: ""
    configured_devices:
      required: false
      example: "False"
      default: true
    redact:
      required: false
      example: "False"
      default: false

reload_code:
  name: Reload code
  description: >-
    For development. Unloads Bermuda, imports its Python files from disk again
    and sets it up, so a code change takes effect without restarting Home
    Assistant. Config flow and manifest changes still need a restart.
